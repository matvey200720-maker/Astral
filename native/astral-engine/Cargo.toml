[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
# Порядок ключей в ответе важен глазам и сравнению с эталоном: `ok`, `command`,
# `result` идут так, как их написала команда.
serde_json = { version = "1", features = ["preserve_order"] }

[workspace.lints.rust]
# `unsafe` разрешается точечно (отображение файла в память) и с пометкой
# `#[allow(unsafe_code)]` на самом месте.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
# Сбой команды ловится и превращается в ответ `{ok:false}`: размотка нужна.
panic = "unwind"
