<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="noindex" />
    <!--
      Стенд сцены попаданий. Отдельная страница разработчика, как стенд окна
      превью: без настольного моста приложение не поднимается, а сцену нужно
      видеть и сверять с кадрами игры, с остановкой времени и сменой
      дальности. База (правила, листы и свет игры) приходит от dev-сервера —
      ту, что запёк scripts/bake-impact-base.mjs.
    -->
    <title>Astral — стенд частиц</title>
    <style>
      html, body { margin: 0; height: 100%; background: #050505; color: #ddd; font: 13px system-ui, sans-serif; }
      #lab { display: grid; grid-template-columns: 1fr 320px; height: 100%; }
      #stage { position: relative; min-height: 0; }
      #stage canvas { width: 100%; height: 100%; display: block; }
      #panel { padding: 12px; overflow: auto; border-left: 1px solid #222; display: grid; gap: 10px; align-content: start; }
      label { display: grid; gap: 4px; }
      select, input, textarea { width: 100%; box-sizing: border-box; }
      textarea { height: 260px; font: 11px ui-monospace, monospace; background: #111; color: #ddd; border: 1px solid #333; }
      #info { white-space: pre-wrap; font: 11px ui-monospace, monospace; color: #9a9a9a; }
    </style>
  </head>
  <body>
    <div id="lab">
      <div id="stage"><canvas id="canvas"></canvas></div>
      <div id="panel">
        <label>Зона <select id="zone"><option value="head">Голова</option><option value="body">Тело</option></select></label>
        <label>Дальность, м <input id="distance" type="range" min="2" max="60" step="1" value="6" /></label>
        <label>Время (0 — идёт) <input id="time" type="range" min="0" max="3" step="0.01" value="0" /></label>
        <label>Зоны редактора (JSON) <textarea id="zones" spellcheck="false"></textarea></label>
        <div id="info"></div>
      </div>
    </div>
    <script type="module" src="/dev/ptfx-lab/main.js"></script>
  </body>
</html>
